<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Amarelo</title>
    <style>
        /* Remove margens padrão e define o fundo amarelo */
        body {
            margin: 0;
            padding: 0;
            background-color: #FFDE00; /* Tom de amarelo vivo e chamativo */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', Impact, sans-serif;
            overflow: hidden;
        }

        /* Estilização do texto centralizado */
        .texto-central {
            font-size: clamp(3rem, 15vw, 10rem); /* Texto responsivo (ajusta no PC e celular) */
            color: #000000; /* Letras pretas para dar contraste */
            text-transform: lowercase; /* Garante que fique escrito "davo" em minúsculo */
            letter-spacing: -2px;
            user-select: none; /* Impede o usuário de selecionar o texto por acidente */
        }
    </style>
</head>
<body>

    <div class="texto-central">quem é o maior heroi da historia? davizao lazarao hitlerzao</div>

</body>
</html>
